# netlify.toml — deploy config for a static site (no build step needed)
[build]
  publish = "."

# Nice URLs: /projects instead of /projects.html
[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Long-cache static assets, always-fresh HTML
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
